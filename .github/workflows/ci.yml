name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: Build, typecheck, lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint + format (biome)
        run: bun run lint

  lint-shell:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Shellcheck
        run: shellcheck install dev-install hooks/statusline

  lint-python:
    name: Ruff lint + format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Ruff check
        run: uvx ruff check benchmarks/

      - name: Ruff format check
        run: uvx ruff format --check benchmarks/

  benchmark-dry-run:
    name: Benchmark dry-run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: "3.14.4"

      - name: Benchmark dry-run (validates script + prompts parse)
        run: uv run python benchmarks/run.py --dry-run
